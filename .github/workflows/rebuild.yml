# Hugging Face データセットの更新を週次で取り込み、data/index.js を自動再生成する
# 手動実行も可能 (Actions タブ → Rebuild index → Run workflow)
name: Rebuild index

on:
  schedule:
    # 毎週月曜 07:00 UTC (JST 月曜 16:00)
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を防止 (cron と手動実行が重なった場合に古い方をキャンセル)
concurrency:
  group: rebuild-index
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 依存パッケージなしで動作するため npm install は不要
      - name: Rebuild data/index.js
        run: node build_index.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh data/index.js (${GITHUB_SHA:0:7})"
            git push
          else
            echo "No dataset update. Nothing to commit."
          fi
